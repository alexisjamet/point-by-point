name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest Node the local server runs on; 24 is the one releases are built with.
        node: [22, 24]
    steps:
      # Actions are pinned to a commit: a tag can be moved to other code, a commit cannot.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the versions agree
        run: node scripts/version.mjs check
      - name: Build
        run: pnpm build
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      # The interface runs in a browser: one Node is enough for it.
      - name: Install Playwright browser
        if: matrix.node == 24
        run: pnpm --filter @point-by-point/ui exec playwright install --with-deps chromium
      - name: Interface tests
        if: matrix.node == 24
        run: pnpm e2e
