name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # For the provenance attestation of the local server.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit: a tag can be moved to other code, a commit cannot. This
      # workflow publishes the release and holds the Cloudflare token.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the versions
        run: node scripts/version.mjs check "${GITHUB_REF_NAME#v}"
      - name: Build (interface URI versioned from package.json)
        run: pnpm build
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Install Playwright browser
        run: pnpm --filter @point-by-point/ui exec playwright install --with-deps chromium
      - name: Interface tests
        run: pnpm e2e
      # The local server is a file people download and run: its checksum, and an attestation that
      # this workflow built it from this commit (gh attestation verify), go with it.
      - name: Checksum of the local server
        run: cd packages/server/dist && sha256sum point-by-point-server.mjs > point-by-point-server.mjs.sha256
      - name: Attest the local server
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/server/dist/point-by-point-server.mjs
      # The Cloudflare token only reaches the deploy step, never the install or build scripts.
      - name: Check for deploy credentials
        id: credentials
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Deploy the Worker
        if: steps.credentials.outputs.present == 'true'
        run: pnpm --filter @point-by-point/server exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Report the skipped deploy
        if: steps.credentials.outputs.present != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the Worker was not deployed. Deploy it with 'pnpm run deploy'."
      - name: Package the skill
        run: cd plugin/skills && zip -r "$GITHUB_WORKSPACE/point-by-point-skill.zip" point-by-point
      - name: Publish the GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" point-by-point-skill.zip "$SERVER" "$SERVER.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" point-by-point-skill.zip "$SERVER" "$SERVER.sha256" --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          # The local server, one file that Node runs as is (see "Run it on your computer").
          SERVER: packages/server/dist/point-by-point-server.mjs
