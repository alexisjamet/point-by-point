<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Point by point</title>
  </head>
  <body>
    <main id="app">
      <div class="sheet-bar">
        <button type="button" id="collapse" class="link-button"></button>
      </div>
      <article id="content" class="response waiting" aria-busy="true"></article>
      <section id="composer" class="composer" hidden>
        <div class="send-row">
          <span class="note-nav">
            <button type="button" id="previous-note" class="nav-button">↑</button>
            <button type="button" id="next-note" class="nav-button">↓</button>
          </span>
          <p id="hint" class="hint"></p>
          <span class="status-group">
            <span id="status" class="status" role="status" hidden></span>
          </span>
          <button type="button" id="send" class="primary"></button>
        </div>
        <p id="error" class="error" role="alert" hidden></p>
        <div id="fallback" class="fallback" hidden>
          <button type="button" id="copy"></button>
          <textarea id="fallback-text" rows="4" readonly></textarea>
        </div>
        <p id="storage-notice" class="storage-notice" hidden></p>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
